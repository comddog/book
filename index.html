<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f45c5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>프로그램 신청</title>
<style>
  :root{
    --navy:#1e2a5a; --brand:#5b64d8; --primary:#2f45c5;
    --line:#dfe4f0; --txt:#22263a; --sub:#6b7280; --bg1:#eef2fb; --bg2:#f8fafc;
    --ok:#0f9d58; --ok-bg:#e8f7ee; --err:#d93025; --err-bg:#fdeceb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
    color:var(--txt); background:linear-gradient(180deg,var(--bg1),var(--bg2)); min-height:100dvh;
    display:flex; flex-direction:column}
  .wrap{width:100%; max-width:430px; margin:0 auto; padding:20px 18px 12px; flex:1; display:flex; flex-direction:column}
  header{text-align:center; padding:10px 0 18px}
  .brand{font-size:14px; letter-spacing:.22em; color:var(--brand); font-weight:600}
  h1{margin:10px 0 0; font-size:27px; line-height:1.3; color:var(--navy); word-break:keep-all}
  .subtitle{display:inline-block; margin-top:10px; padding:6px 16px; border-radius:999px;
    background:#e3e8fb; color:var(--primary); font-size:14px; font-weight:700}
  .card{background:#fff; border-radius:18px; padding:20px 18px; box-shadow:0 8px 24px rgba(30,42,90,.08)}
  footer{text-align:center; color:#98a1b8; font-size:14px; letter-spacing:.08em;
    padding:20px 0 max(14px, env(safe-area-inset-bottom))}
  .muted{color:var(--sub)}
  .center{text-align:center}
  .sec-title{font-size:14px; font-weight:800; color:var(--navy); margin:0 0 10px}
  .agree-box{background:#f6f8fd; border:1px solid #e3e9f7; border-radius:12px; padding:14px 16px;
    font-size:14px; line-height:1.8; color:#3a4160; word-break:keep-all}
  .check-row{display:flex; align-items:flex-start; gap:10px; margin-top:14px; font-size:14.5px;
    font-weight:600; color:var(--txt); cursor:pointer; line-height:1.5}
  .check-row input{width:20px; height:20px; accent-color:var(--primary); flex:none; margin-top:1px}
  .lead{text-align:center; font-size:15px; line-height:1.6; margin:8px 0 14px}
  .lead.small{font-size:13px; color:var(--sub); margin:6px 0 0}
  .done{text-align:center; font-size:20px; font-weight:800; color:var(--navy); margin:14px 0 8px}
  .clock-row{display:flex; justify-content:space-between; align-items:baseline; padding:10px 2px; font-size:15px; gap:10px}
  .clock-row .lbl{color:var(--sub); font-size:14px; flex:none}
  .clock-row b{font-weight:700; font-variant-numeric:tabular-nums; text-align:right}
  .count-box{margin-top:12px; background:linear-gradient(135deg,#2f45c5,#5b64d8); border-radius:16px;
    padding:18px; text-align:center; color:#fff}
  .count-lbl{font-size:13px; opacity:.85}
  .count{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:.02em; margin-top:4px}
  .field{margin:12px 0}
  .field label{display:block; font-size:13px; color:var(--sub); font-weight:600; margin-bottom:6px; word-break:keep-all}
  .field input,.field select{width:100%; height:48px; font-size:16px; font-family:inherit; padding:0 14px;
    border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--txt); outline:none}
  .field input:focus,.field select:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(47,69,197,.12)}
  .hint{font-size:12px; color:#98a1b8; margin-top:5px; min-height:1em; line-height:1.5}
  .hint.ok-hint{color:#0b7a43; font-weight:600}
  .hint.err-hint{color:var(--err); font-weight:600}
  .btn{width:100%; height:52px; margin-top:14px; border:0; border-radius:14px; background:var(--primary);
    font-family:inherit; color:#fff; font-size:17px; font-weight:700; cursor:pointer}
  .btn:disabled{opacity:.5; cursor:default}
  .box{border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.55; margin-top:12px; word-break:keep-all}
  .box.ok{background:var(--ok-bg); color:#0b7a43}
  .box.err{background:var(--err-bg); color:var(--err)}
  .box.warn{background:#fff7e0; color:#8a6d00}
  .badge{display:block; text-align:center; border-radius:14px; padding:14px; font-weight:800}
  .ok-badge{background:var(--ok-bg); color:#0b7a43; font-size:15px; padding:8px; margin-bottom:8px}
  .main-badge{background:linear-gradient(135deg,#2f45c5,#5b64d8); color:#fff; font-size:20px}
  .note{color:var(--sub); font-size:12px; text-align:right; margin:6px 2px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">일광책꿈터 별빛도서관</div>
    <h1 id="programTitle">책과 문화의 밤</h1>
    <div class="subtitle">프로그램 신청</div>
  </header>
  <main id="panel" class="card"><p class="center muted">준비 중…</p></main>
  <footer>일광초등학교</footer>
</div>
<script>
'use strict';

/* ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
 * 백엔드 웹앱 주소(/exec) — 이미 설정되어 있습니다.
 * 재배포 등으로 주소가 바뀐 경우에만 아래 값을 수정하세요.
 * ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2lc-0KCGSlrHdgeqpBDjj0VriTuRvM9EYELiWSyiiLqHfv0eUK1WvgmMBKHCGL7eF/exec';

/* ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
 * 빠른 조회용 — 스프레드시트 '현황' 탭 웹 게시 링크 (수정내용2 가이드 3단계)
 * 여기에 게시 링크를 넣으면 조회가 Apps Script를 거치지 않아 훨씬 빨라집니다.
 * 비워 두면 기존 방식(GAS 조회)으로 동작하며, 게시 읽기가 실패해도 GAS로 자동 전환됩니다.
 * ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */
const PUB_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTkUOHGSXJKmCpAFgCyo6Ibj6vgqwGbYv2Uq07jisKNs06UO9qFXUDImzqdFRugJcD0lW4yGNzNxmn2/pubhtml?gid=672284980&single=true';

const $ = function (id) { return document.getElementById(id); };
const esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
function pad(n) { return String(n).padStart(2, '0'); }

/* 서버 기준 한국 시각 표시 (기기 시계 오차와 무관) */
function fmtKst(ms, withSec) {
  const d = new Date(ms + 9 * 3600 * 1000);
  const wd = ['일', '월', '화', '수', '목', '금', '토'][d.getUTCDay()];
  return d.getUTCFullYear() + '년 ' + (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() +
    '일 (' + wd + ') ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) +
    (withSec ? ':' + pad(d.getUTCSeconds()) : '');
}

function fmtRemaining(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const d = Math.floor(s / 86400);
  const h = Math.floor((s % 86400) / 3600);
  const m = Math.floor((s % 3600) / 60);
  return (d > 0 ? d + '일 ' : '') + pad(h) + ':' + pad(m) + ':' + pad(s % 60);
}

let st = null;            // 최신 status 응답
let offsetMs = 0;         // 서버(구글) 시각 - 이 기기 시각
let step = 0;             // 0: 개인정보 동의, 1: 안내사항, 2: 신청 화면
let view = 'consent';     // consent | notice | loading | error | before | open | closed | result
let switching = false;    // 카운트다운 0 도달 → 화면 전환 중
let submitting = false;
let renderedOpenAt = null; // '신청 시작 전' 화면에 그린 오픈 시각 (관리자가 바꾸면 재렌더)
let statusPromise = null;  // 백엔드 상태 미리 불러오기 (동의·안내 화면 동안 진행)

function nowMs() { return Date.now() + offsetMs; }
function setView(html) { $('panel').innerHTML = html; }
function field(label, inner) {
  return '<div class="field"><label>' + label + '</label>' + inner + '</div>';
}

/* ---------------- 1단계·2단계 화면 (동의 → 안내) ---------------- */

function gateCard(title, items, checkLabel, onNext) {
  setView(
    '<div class="card">' +
      '<p class="sec-title">' + title + '</p>' +
      '<div class="agree-box">' +
        items.map(function (t, i) { return '<div>' + (i + 1) + '. ' + esc(t) + '</div>'; }).join('') +
      '</div>' +
      '<label class="check-row"><input type="checkbox" id="agreeChk"><span>' + checkLabel + '</span></label>' +
      '<button id="nextBtn" class="btn" disabled>다음</button>' +
    '</div>'
  );
  $('agreeChk').addEventListener('change', function () {
    $('nextBtn').disabled = !$('agreeChk').checked;
  });
  $('nextBtn').addEventListener('click', function () {
    if (!$('agreeChk').checked) return;
    onNext();
  });
}

function showConsent() {
  view = 'consent';
  gateCard('개인정보 수집 및 이용 동의', [
    '수집하는 개인정보 항목 : 이름과 연락처',
    '수집 및 이용 목적 : 프로그램 진행 및 팀 구분, 출석 관리',
    '보유 및 이용기간 : 프로그램 진행 후 폐기'
  ], '개인정보 수집 및 이용에 동의합니다.', function () {
    step = 1;
    showNotice();
  });
}

function showNotice() {
  view = 'notice';
  gateCard('안내사항', [
    '기록할 내용은 학번, 학생명, 보호자명, 보호자 연락처입니다.',
    '중복 신청 또는 신청 내용이 사실과 다를 경우 프로그램 참여가 제한됩니다.',
    '단말기 또는 인터넷 환경으로 접속에 지연이 발생할 수 있습니다.'
  ], '확인했습니다.', enterApp);
}

/* ---------------- 신청 화면 상태별 렌더링 ---------------- */

function showLoading() {
  view = 'loading';
  setView('<p class="center muted">불러오는 중…</p>');
}

function showFatal(msgHtml, retry) {
  view = 'error';
  setView('<div class="box err">' + msgHtml + '</div>' +
    (retry ? '<button class="btn" id="retryBtn">다시 시도</button>' : ''));
  if (retry) $('retryBtn').addEventListener('click', enterApp);
}

function showBefore() {
  view = 'before';
  renderedOpenAt = st.openAt;
  if (!st.openAt) {
    // 신청시작이 설정 오류인 경우 (Code.gs가 안전하게 잠근 상태)
    setView('<div class="box warn">관리자 설정 확인 중입니다.<br>신청시작 시각 설정에 문제가 있으니 관리자에게 문의해 주세요.</div>');
    return;
  }
  setView(
    '<p class="lead">아직 신청 시간이 아닙니다.<br>신청은 아래 시각에 시작됩니다.</p>' +
    '<div class="clock-row"><span class="lbl">현재 시각</span><b id="nowClock">' +
      esc(fmtKst(nowMs(), true)) + '</b></div>' +
    '<div class="clock-row"><span class="lbl">신청 시작</span><b>' + esc(fmtKst(st.openAt, false)) + '</b></div>' +
    '<div class="count-box"><div class="count-lbl">남은 시간</div>' +
      '<div class="count" id="remain">' + esc(fmtRemaining(st.openAt - nowMs())) + '</div></div>'
  );
}

function showOpen() {
  view = 'open';
  setView(
    '<p class="lead small">신청한 순서로 접수되며, 결과를 앱과 문자메시지로 안내합니다.</p>' +
    '<form id="form" novalidate>' +
      field('학번 (예: 1101 - 1학년 1반 1번)',
        '<input id="f_sid" type="text" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">' +
        '<div class="hint" id="sidHint"></div>') +
      field('학생명', '<input id="f_student" type="text" maxlength="20" placeholder="예: 김일광" autocomplete="off">') +
      field('보호자명', '<input id="f_guardian" type="text" maxlength="20" placeholder="예: 김별빛" autocomplete="off">') +
      field("보호자 연락처 (숫자만 입력, '-' 자동생성)",
        '<input id="f_phone" type="tel" inputmode="numeric" maxlength="13" placeholder="010-0000-0000" autocomplete="tel">') +
      '<div id="formErr" class="box err" style="display:none"></div>' +
      '<button id="submitBtn" class="btn" type="submit">신청하기</button>' +
    '</form>'
  );
  $('form').addEventListener('submit', onSubmit);
  $('f_sid').addEventListener('input', onSidInput);
  $('f_phone').addEventListener('input', onPhoneInput);
}

/* 학번 입력: 숫자만 4자리, 입력이 끝나면 "N학년 N반 N번"으로 해석해 보여줌 */
function onSidInput() {
  const el = $('f_sid');
  el.value = el.value.replace(/\D/g, '').slice(0, 4);
  const h = $('sidHint');
  const v = el.value;
  h.className = 'hint';
  if (v.length < 4) { h.textContent = ''; return; }
  const g = Number(v.charAt(0)), c = Number(v.charAt(1)), n = Number(v.slice(2));
  if (g >= 1 && g <= 6 && c >= 1 && c <= 9 && n >= 1 && n <= 99) {
    h.textContent = g + '학년 ' + c + '반 ' + n + '번';
    h.className = 'hint ok-hint';
  } else {
    h.textContent = '학번을 확인해 주세요 (예: 1101 - 1학년 1반 1번)';
    h.className = 'hint err-hint';
  }
}

function onPhoneInput() {
  const el = $('f_phone');
  const d = el.value.replace(/\D/g, '').slice(0, 11);
  if (d.length > 7) el.value = d.slice(0, 3) + '-' + d.slice(3, 7) + '-' + d.slice(7);
  else if (d.length > 3) el.value = d.slice(0, 3) + '-' + d.slice(3);
  else el.value = d;
}

function showClosed() {
  view = 'closed';
  setView(
    '<p class="done">신청이 마감되었습니다.</p>' +
    '<p class="center muted" style="line-height:1.7">관심 가져 주셔서 감사합니다.</p>'
  );
}

function showResult(d) {
  view = 'result';
  /* 서버(구글) 시각으로 기록된 제출 시각을 '년월일시분초'로 표시 */
  const m = String(d.submittedAt || '').match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2})$/);
  const ts = m
    ? m[1] + '년 ' + Number(m[2]) + '월 ' + Number(m[3]) + '일 ' +
      m[4] + '시 ' + m[5] + '분 ' + m[6] + '초'
    : esc(d.submittedAt || '');
  const digits = String($('f_phone') ? $('f_phone').value : '').replace(/\D/g, '');
  const masked = digits ? digits.slice(0, 3) + '-****-' + digits.slice(-4) : '';
  const badge = d.confirmed
    ? '선착순 ' + d.order + '번 확정'
    : '대기자 ' + d.waitlistOrder + '번 배정';
  setView(
    '<div class="badge ok-badge">접수 완료!</div>' +
    '<div class="badge main-badge">' + esc(badge) + '</div>' +
    '<div class="clock-row" style="margin-top:12px"><span class="lbl">제출 시각</span><b>' + ts + '</b></div>' +
    '<p class="note">인터넷 시간 기준</p>' +
    '<div class="box ' + (d.smsSent ? 'ok' : 'warn') + '">' +
      (d.smsSent
        ? '보호자 연락처(' + esc(masked) + ')로 접수 문자를 발송했습니다.'
        : '접수는 완료되었지만 문자 발송에 실패했습니다.<br>관리자에게 문의해 주세요.') +
    '</div>'
  );
}

/* ---------------- 서버 통신 ---------------- */

function updateHeader() {
  $('programTitle').textContent = st.title || '책과 문화의 밤';
  document.title = (st.title ? st.title + ' · ' : '') + '프로그램 신청';
}

/* ---------------- 상태 조회 ----------------
 * 기본 경로: '현황' 탭 웹 게시 데이터를 브라우저가 직접 읽음 (Apps Script 기동 대기 없음)
 * 폴백 경로: 게시 링크 미설정·읽기 실패 시 기존 GAS 조회 (서버 시각 동기화 포함) */

/* '현황' 탭 웹 게시 CSV 주소 — pubhtml 링크든 2PACX ID든 받아서 표준 pub?output=csv 형태로 만든다 */
function pubCsvUrl_() {
  const v = String(PUB_URL || '').trim();
  if (!v) return '';
  const id = (v.match(/\/d\/e\/(2PACX-[A-Za-z0-9_-]+)/) || /2PACX-[A-Za-z0-9_-]{20,}/.exec(v) || [, ''])[1];
  if (!id) return '';
  const g = v.match(/[?&]gid=(\d+)/);
  return 'https://docs.google.com/spreadsheets/d/e/' + id + '/pub?' +
         (g ? 'gid=' + g[1] + '&single=true&' : '') + 'output=csv';
}

function readStatusPublished() {
  const url = pubCsvUrl_();
  if (!url) return Promise.reject(new Error('게시 링크 미설정'));
  return fetch(url + '&_=' + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error('게시 데이터 읽기 실패');
      return r.text();
    })
    .then(parseCsvStatus_);
}

/* 따옴표(이스케이프 포함)를 지원하는 최소 CSV 파서 */
function parseCsvRows_(text) {
  const rows = [];
  let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text.charAt(i);
    if (q) {
      if (c === '"') {
        if (text.charAt(i + 1) === '"') { cell += '"'; i++; }
        else q = false;
      } else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

/* 게시 CSV → 기존 status 형식으로 변환 (Code.gs의 판정 로직과 동일 기준) */
function parseCsvStatus_(text) {
  const rows = parseCsvRows_(text);
  const map = {};
  rows.forEach(function (r) {
    const key = String(r[0] == null ? '' : r[0]).trim();
    if (key && key !== '항목') map[key] = r[1] == null ? '' : r[1];
  });
  const title = String(map['제목'] || '').trim() || '9월 책과 문화의 밤';
  const openRaw = String(map['신청시작'] || '').trim();
  const openMs = parseKstClient_(openRaw);            // 밀리초 | null(미설정) | 'INVALID'
  const invalid = openRaw !== '' && openMs === 'INVALID';
  const count = Number(map['접수수']) || 0;
  const total = Number(map['마감자수']) || 0;
  const closed = total > 0 && count >= total;
  let phase;
  if (invalid) phase = 'before';
  else if (closed) phase = 'closed';
  else if (openRaw === '' || openMs === null) phase = 'open';   // 신청시작 미설정 = 즉시 오픈
  else phase = (Date.now() >= openMs) ? 'open' : 'before';
  return {
    ok: true,
    title: title,
    phase: phase,
    openAt: invalid ? null : (openMs === 'INVALID' ? null : openMs),
    openAtInvalid: invalid,
    count: count,
    limit: total,
    serverTime: Date.now()
  };
}

/* "2026-10-05 19:00"·"2026-10-05T19:00"·gviz Date(...) 형태를 KST(UTC+9) 밀리초로 */
function parseKstClient_(text) {
  const s = String(text || '').trim();
  if (!s) return null;
  const m = s.match(/^Date\((\d+),(\d+),(\d+),(\d+),(\d+),(\d+)\)/);
  if (m) return Date.UTC(+m[1], +m[2], +m[3], +m[4], +m[5], +m[6]);
  const t = s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (!t) return 'INVALID';
  return Date.UTC(+t[1], +t[2] - 1, +t[3], +(t[4] || 0), +(t[5] || 0), +(t[6] || 0))
         - 9 * 60 * 60 * 1000;
}

/* GAS 조회 (폴백) — 응답 시각으로 기기 시계 보정까지 해 줌 */
async function fetchStatus() {
  const t0 = Date.now();
  const r = await fetch(GAS_URL + '?action=status&_=' + Date.now());
  const d = await r.json();
  const t1 = Date.now();
  if (!d || d.ok !== true) throw new Error('bad status');
  offsetMs = d.serverTime - Math.round((t0 + t1) / 2);
  return d;
}

/* 서버 시각 보정 — 저주기(10분)로만 GAS를 호출해 기기 시계 오차를 줄인다.
   상태 조회는 계속 gviz(빠른 경로)를 쓰고, 여기서는 offsetMs 갱신만 사용한다. */
async function syncClock() {
  await fetchStatus();
}

function applyStatus(d) {
  st = d;
  updateHeader();
  if (step === 2 && view !== 'result') render();
}

/* 동의·안내 화면 동안 상태를 미리 불러온다 (신청 화면 진입 지연 최소화).
   실패하면 statusPromise를 비워 다음 시도에서 재조회할 수 있게 한다. */
function loadStatus(force) {
  if (force) statusPromise = null;
  if (!statusPromise) {
    statusPromise = readStatusPublished()
      .catch(function () { return fetchStatus(); })   // 게시 실패 → GAS 폴백
      .then(applyStatus)
      .catch(function (e) {
        statusPromise = null;
        throw e;
      });
  }
  return statusPromise;
}

function render() {
  if (!st) return;
  updateHeader();
  const target = st.phase === 'before' ? 'before' : (st.phase === 'open' ? 'open' : 'closed');
  if (view === target) {
    // 같은 화면이면 다시 그리지 않음 — 30초 폴링이 입력 중인 신청서를 지우지 않도록 함
    if (target === 'before' && st.openAt !== renderedOpenAt) showBefore();
    return;
  }
  if (target === 'before') showBefore();
  else if (target === 'open') showOpen();
  else showClosed();
}

/* 안내사항 확인 → 신청 화면 진입 (미리 불러둔 상태가 없으면 그때 조회) */
function enterApp() {
  step = 2;
  if (st) { render(); return; }
  showLoading();
  loadStatus().catch(function () {
    showFatal('서버에 연결할 수 없습니다.<br>인터넷 연결을 확인하거나 잠시 후 다시 시도해 주세요.', true);
  });
}

async function onSubmit(e) {
  e.preventDefault();
  if (submitting) return;
  const sid = $('f_sid').value;
  const student = $('f_student').value.trim();
  const guardian = $('f_guardian').value.trim();
  const phoneD = $('f_phone').value.replace(/\D/g, '');
  const err = $('formErr');
  const fail = function (msg) { err.innerHTML = esc(msg); err.style.display = 'block'; };
  err.style.display = 'none';

  if (!/^\d{4}$/.test(sid)) return fail('학번을 확인해 주세요. (예: 1101 - 1학년 1반 1번)');
  const g = Number(sid.charAt(0)), c = Number(sid.charAt(1)), n = Number(sid.slice(2));
  if (g < 1 || g > 6 || c < 1 || c > 9 || n < 1 || n > 99) {
    return fail('학번을 확인해 주세요. (예: 1101 - 1학년 1반 1번)');
  }
  if (!student) return fail('학생명을 입력해 주세요.');
  if (!guardian) return fail('보호자명을 입력해 주세요.');
  if (!/^01[016789]\d{7,8}$/.test(phoneD)) return fail('연락처를 확인해 주세요. (예: 010-1234-5678)');

  const btn = $('submitBtn');
  submitting = true;
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = '접수 중…';
  try {
    const q = new URLSearchParams({
      action: 'submit', sid: sid, student: student, guardian: guardian,
      phone: phoneD, consent: '1', notice: '1', _: String(Date.now())
    });
    const r = await fetch(GAS_URL + '?' + q.toString());
    const d = await r.json();
    if (d && d.ok) { showResult(d); return; }
    if (d && (d.error === 'FULL' || d.error === 'NOT_OPEN')) {
      /* 서버 판정이 최우선 — 게시 데이터 갱신 지연과 무관하게 정확한 상태로 전환 시도 */
      try { applyStatus(await fetchStatus()); } catch (e2) { /* 전환 실패 시 아래 안내 문구로 커버 */ }
      /* 화면이 그대로면(갱신 지연 등) 마감·미오픈 안내를 폼 안에 남겨 혼동을 막음 */
      fail(d.detail || '지금은 접수할 수 없습니다.');
      return;
    }
    if (d && d.error === 'DUPLICATE') {
      fail('이미 접수된 신청입니다. (같은 학생명과 연락처로 중복 접수할 수 없습니다)');
      return;
    }
    fail((d && d.detail) || '접수에 실패했습니다. 다시 시도해 주세요.');
  } catch (err2) {
    fail('네트워크 오류입니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');
  } finally {
    submitting = false;
    btn.disabled = false;
    btn.textContent = old;
  }
}

/* ---------------- 시작 ---------------- */

async function boot() {
  if (!GAS_URL || GAS_URL.indexOf('http') !== 0) {
    showFatal('앱이 아직 백엔드에 연결되지 않았습니다.<br>index.html의 GAS_URL 설정을 확인하세요. (상세설정가이드 5단계)', false);
    return;
  }
  showConsent();                       // 동의·안내 화면을 먼저 보여주고
  loadStatus().catch(function () {});  // 그동안 백엔드 상태를 미리 불러온다
  syncClock().catch(function () {});   // 서버 시각 보정 1회 (실패해도 10분 주기로 재시도)
}

/* ---------------- 타이머 ---------------- */

/* 1초마다: 신청 전 화면의 현재 시각·남은 시간 갱신, 시작 시각 도달 시 즉시 전환 */
setInterval(function () {
  if (!st) return;
  if (view === 'before' && st.openAt) {
    const rem = st.openAt - nowMs();
    const clockEl = $('nowClock');
    const remainEl = $('remain');
    if (clockEl) clockEl.textContent = fmtKst(nowMs(), true);
    if (remainEl) remainEl.textContent = fmtRemaining(rem);
    if (rem <= 0 && !switching) {
      switching = true;
      if (remainEl) remainEl.textContent = '신청 화면 전환중';
      loadStatus(true).then(function () { switching = false; })
                     .catch(function () { switching = false; });
    }
  }
}, 1000);

/* 30초마다: 마감 여부 갱신 (동의·안내 화면과 결과 화면에서는 정지) */
setInterval(function () {
  if (step !== 2 || !st || view === 'result' || switching || submitting) return;
  loadStatus(true).catch(function () { /* 다음 주기에 재시도 */ });
}, 30000);

/* 10분마다: 구글 서버 시각으로 시계 보정 — 기기마다 달랐던 카운트다운(1~3초)을 맞춘다.
   저주기 호출이라 Apps Script 기동 지연이 조회 속도에는 영향을 주지 않는다. */
setInterval(function () {
  syncClock().catch(function () { /* 다음 주기에 재시도 */ });
}, 600000);

boot();
</script>
</body>
</html>
