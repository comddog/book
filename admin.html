<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f45c5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>관리자 모드</title>
<style>
  :root{
    --navy:#1e2a5a; --brand:#5b64d8; --primary:#2f45c5;
    --line:#dfe4f0; --txt:#22263a; --sub:#6b7280; --bg1:#eef2fb; --bg2:#f8fafc;
    --ok:#0f9d58; --ok-bg:#e8f7ee; --err:#d93025; --err-bg:#fdeceb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
    color:var(--txt); background:linear-gradient(180deg,var(--bg1),var(--bg2)); min-height:100dvh;
    display:flex; flex-direction:column}
  .wrap{width:100%; max-width:430px; margin:0 auto; padding:20px 18px 12px; flex:1; display:flex; flex-direction:column}
  header{text-align:center; padding:10px 0 18px}
  .brand{font-size:14px; letter-spacing:.22em; color:var(--brand); font-weight:600}
  h1{margin:10px 0 0; font-size:27px; line-height:1.3; color:var(--navy); word-break:keep-all}
  .subtitle{display:inline-block; margin-top:10px; padding:6px 16px; border-radius:999px;
    background:#e3e8fb; color:var(--primary); font-size:14px; font-weight:700}
  .card{background:#fff; border-radius:18px; padding:20px 18px; box-shadow:0 8px 24px rgba(30,42,90,.08)}
  main{flex:1; display:flex; flex-direction:column; gap:14px}
  footer{text-align:center; color:#98a1b8; font-size:14px; letter-spacing:.08em;
    padding:20px 0 max(14px, env(safe-area-inset-bottom))}
  .muted{color:var(--sub)}
  .center{text-align:center}
  .sec-title{font-size:13px; font-weight:800; color:var(--navy); letter-spacing:.06em; margin:0 0 8px}
  .sum-row{display:flex; justify-content:space-between; align-items:baseline; padding:9px 2px;
    font-size:14.5px; gap:10px; border-bottom:1px solid #f0f2fa}
  .sum-row:last-child{border-bottom:0}
  .sum-row .k{color:var(--sub); flex:none}
  .sum-row .v{font-weight:700; font-variant-numeric:tabular-nums; text-align:right; word-break:keep-all}
  .sum-row .v .em{color:var(--primary); font-size:16px}
  .field{margin:12px 0}
  .field label{display:block; font-size:13px; color:var(--sub); font-weight:600; margin-bottom:6px}
  .field input,.field select{width:100%; height:48px; font-size:16px; font-family:inherit; padding:0 14px;
    border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--txt); outline:none}
  .field input:focus,.field select:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(47,69,197,.12)}
  .hint{font-size:12px; color:#98a1b8; margin-top:5px; line-height:1.5}
  .row2{display:flex; gap:10px}
  .row2 .field{flex:1; margin-top:0}
  .btn{width:100%; height:52px; margin-top:14px; border:0; border-radius:14px; background:var(--primary);
    font-family:inherit; color:#fff; font-size:17px; font-weight:700; cursor:pointer}
  .btn:disabled{opacity:.55}
  .btn.ghost{background:#eef1fb; color:var(--primary)}
  .btn.mini{height:40px; font-size:14px; margin-top:10px}
  .box{border-radius:12px; padding:12px 14px; font-size:14px; line-height:1.55; margin-top:12px; word-break:keep-all}
  .box.ok{background:var(--ok-bg); color:#0b7a43}
  .box.err{background:var(--err-bg); color:var(--err)}
  .box.info{background:#f1f3fb; color:#41508f}
  .box.warn{background:#fff7e0; color:#8a6d00}
  .tabs{display:flex; gap:8px; margin-bottom:2px}
  .tab{flex:1; height:44px; border:0; border-radius:12px; background:#eef1fb; color:var(--primary);
    font-family:inherit; font-size:15px; font-weight:700; cursor:pointer}
  .tab.on{background:var(--primary); color:#fff}
  table.list{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:8px}
  table.list th,table.list td{border-bottom:1px solid #eef1f6; padding:8px 6px; text-align:left; vertical-align:top}
  table.list th{color:var(--sub); font-size:12px; font-weight:700; white-space:nowrap}
  .pill{display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700}
  .pill.ok{background:var(--ok-bg); color:#0b7a43}
  .pill.wait{background:#fff3d6; color:#8a6d00}
  .btn.danger{background:var(--err)}
  .btn.small{height:36px; font-size:13px; margin-top:0; padding:0 10px; width:auto}
  textarea.msg{width:100%; min-height:120px; font-size:15px; font-family:inherit; padding:12px 14px;
    border:1.5px solid var(--line); border-radius:12px; outline:none; resize:vertical}
  textarea.msg:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(47,69,197,.12)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">일광책꿈터 별빛도서관</div>
    <h1>관리자 모드</h1>
    <div class="subtitle">프로그램 설정 · 접수 현황</div>
  </header>
  <main id="panel">
    <div class="card"><p class="center muted">불러오는 중…</p></div>
  </main>
  <footer>일광초등학교</footer>
</div>
<script>
'use strict';

/* ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★
 * 설정가이드.md 5단계 — 아래 따옴표 안에 배포된 웹앱 주소(/exec)를 붙여넣으세요.
 * (index.html과 같은 주소입니다)
 * ★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★★ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw2lc-0KCGSlrHdgeqpBDjj0VriTuRvM9EYELiWSyiiLqHfv0eUK1WvgmMBKHCGL7eF/exec';

const $ = function (id) { return document.getElementById(id); };
const esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
function pad(n) { return String(n).padStart(2, '0'); }

function fmtKst(ms, withSec) {
  const d = new Date(ms + 9 * 3600 * 1000);
  const wd = ['일', '월', '화', '수', '목', '금', '토'][d.getUTCDay()];
  return d.getUTCFullYear() + '년 ' + (d.getUTCMonth() + 1) + '월 ' + d.getUTCDate() +
    '일 (' + wd + ') ' + pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) +
    (withSec ? ':' + pad(d.getUTCSeconds()) : '');
}

let pw = '';
let data = null;          // admin_get 응답 (values / effective / count)
let autoTotal = true;     // 마감자수 자동 계산(모집+대기) 사용 중
let busy = false;

function setPanel(html) { $('panel').innerHTML = html; }

async function api(params, timeoutMs) {
  const q = new URLSearchParams(Object.assign({ _: String(Date.now()) }, params));
  const ctrl = timeoutMs ? new AbortController() : null;
  const t = ctrl ? setTimeout(function () { ctrl.abort(); }, timeoutMs) : null;
  try {
    const r = await fetch(GAS_URL + '?' + q.toString(), ctrl ? { signal: ctrl.signal } : undefined);
    return await r.json();
  } finally {
    if (t) clearTimeout(t);
  }
}

/* 콜드 스타트 예열 — 게이트가 뜨는 즉시 GAS를 백그라운드로 깨워 둔다.
   비밀번호를 입력하는 몇 초 동안 서버가 기동되어 [접속]이 빨라진다. 결과는 버린다. */
function warmUp() {
  fetch(GAS_URL + '?action=status&_=' + Date.now()).catch(function () {});
}

/* ---------------- 비밀번호 게이트 ---------------- */

function showGate(msg) {
  warmUp();   // 비밀번호 입력 시간 동안 GAS를 미리 깨워 둠 (콜드 스타트 예열)
  setPanel(
    '<div class="card">' +
      '<div class="field"><label>접속 비밀번호</label>' +
        '<input id="pwInput" type="password" inputmode="text" autocomplete="current-password" placeholder="비밀번호 입력">' +
      '</div>' +
      (msg ? '<div class="box err">' + esc(msg) + '</div>' : '') +
      '<button id="loginBtn" class="btn" style="margin-top:4px">접속</button>' +
    '</div>'
  );
  $('loginBtn').addEventListener('click', login);
  $('pwInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  $('pwInput').focus();
}

async function login() {
  if (busy) return;
  const v = $('pwInput') ? $('pwInput').value : '';
  if (!v) {
    if ($('pwInput')) $('pwInput').focus();
    return;
  }
  busy = true;
  const btn = $('loginBtn');
  if (btn) { btn.disabled = true; btn.textContent = '확인 중…'; }
  // 4초 넘게 걸리면 서버 기동 중이라는 안내로 바꿔 체감 대기 완화
  const slowT = setTimeout(function () {
    if (btn) btn.textContent = '서버 깨우는 중… (처음엔 10초 이상 걸릴 수 있음)';
  }, 4000);
  try {
    /* 서버가 잠들어 있으면 첫 요청이 실패할 수 있으므로 최대 3회 시도(1.5초·3초 대기).
       재시도 시점에는 서버가 기동 중이라 대부분 성공한다. */
    let d = null;
    for (let i = 0; i < 3; i++) {
      try {
        d = await api({ action: 'admin_get', pass: v }, 15000);
        break;
      } catch (e) {
        d = null;
        if (i < 2) await new Promise(function (r) { setTimeout(r, 1500 + i * 1500); });
      }
    }
    if (d && d.ok) {
      pw = v;
      try { sessionStorage.setItem('ilgwang_pw', pw); } catch (e) {}
      data = d;
      showMain();
    } else if (d && !d.ok) {
      showGate((d && d.detail) || '비밀번호가 올바르지 않습니다.');
    } else {
      showGate('서버에 연결할 수 없습니다. GAS_URL 설정과 인터넷 연결을 확인하세요.');
    }
  } catch (e2) {
    showGate('서버에 연결할 수 없습니다. GAS_URL 설정과 인터넷 연결을 확인하세요.');
  } finally {
    clearTimeout(slowT);
    busy = false;
  }
}

/* ---------------- 설정 화면 ---------------- */

function phaseOf() {
  if (!data) return '';
  const e = data.effective;
  const now = Date.now();
  if (e.openAtInvalid) return '설정 오류 — 신청시작 형식 확인 필요';
  if (e.manualClosed) return '마감 유지 중 (빈자리 ' + Math.max(0, e.total - data.count) + '명, 추가접수 없음)';
  if (data.count >= e.total) return '신청 마감';
  if (e.openAtMs === null) return '신청 진행 중 (시작 시각 미설정 → 즉시 오픈)';
  if (now < e.openAtMs) return '신청 시작 전 · ' + fmtKst(e.openAtMs, false) + ' 오픈';
  return '신청 진행 중';
}

function renderSummary() {
  const e = data.effective;
  const row = function (k, v) {
    return '<div class="sum-row"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  };
  $('sumList').innerHTML =
    row('적용 제목', esc(e.title)) +
    row('신청 시작', e.openAtInvalid ? '<span class="muted">형식 오류</span>'
        : (e.openAtMs === null ? '미설정 (즉시 오픈)' : esc(fmtKst(e.openAtMs, false)))) +
    row('모집인원(확정)', e.confirmed + '명') +
    row('대기자수', e.waitlist + '명') +
    row('마감자수', e.total + '명') +
    row('현재 접수', '<span class="em">' + data.count + '명</span>') +
    row('남은 자리', Math.max(0, e.total - data.count) + '명') +
    row('상태', esc(phaseOf()));
}

/* 시트 원본 "2026-10-05 19:00[:ss]" → datetime-local 값 "2026-10-05T19:00" */
function openToLocal(s) {
  const m = String(s || '').match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})[ T](\d{1,2}):(\d{2})/);
  if (!m) return '';
  return m[1] + '-' + pad(Number(m[2])) + '-' + pad(Number(m[3])) + 'T' +
    pad(Number(m[4])) + ':' + m[5];
}

let tab = 'list';            // list | settings | sms — 기본은 명단 탭
let rows = [];                // admin_list 결과 캐시
let listFilter = '';

function showMain() {
  const v = data.values;
  const e = data.effective;
  setPanel(
    '<div class="card">' +
      '<p class="sec-title">현재 운영 현황</p>' +
      '<div id="sumList"></div>' +
    '</div>' +
    '<div class="tabs">' +
      '<button class="tab" id="tabList">접수명단</button>' +
      '<button class="tab" id="tabSms">문자발송</button>' +
      '<button class="tab" id="tabSet">설정</button>' +
    '</div>' +
    '<div class="card" id="tabBody"></div>' +
    '<div class="card">' +
      '<p class="sec-title">기타</p>' +
      '<div id="reopenWrap"></div>' +
      '<button id="lockBtn" class="btn ghost mini">비밀번호 다시 입력하기</button>' +
    '</div>'
  );
  renderSummary();
  paintReopen();
  $('tabList').addEventListener('click', function () { switchTab('list'); });
  $('tabSms').addEventListener('click', function () { switchTab('sms'); });
  $('tabSet').addEventListener('click', function () { switchTab('settings'); });
  $('lockBtn').addEventListener('click', function () {
    try { sessionStorage.removeItem('ilgwang_pw'); } catch (e2) {}
    pw = '';
    rows = []; listLoaded = false; listFilter = ''; tab = 'list';
  warmUp();      // 비밀번호 입력 시간 동안 GAS를 미리 깨워 둠 (콜드 스타트 예열)
  showGate('');
  });
  switchTab(tab);
}

function switchTab(t) {
  tab = t;
  const tabs = { list: $('tabList'), sms: $('tabSms'), settings: $('tabSet') };
  Object.keys(tabs).forEach(function (k) { if (tabs[k]) tabs[k].className = 'tab' + (k === t ? ' on' : ''); });
  if (t === 'list') renderListTab();
  else if (t === 'sms') renderSmsTab();
  else renderSettingsTab();
}

/* ---------------- 마감 해제 ---------------- */

function paintReopen() {
  const w = $('reopenWrap');
  if (!w) return;
  if (data && data.effective && data.effective.manualClosed) {
    w.innerHTML = '<div class="box warn">마감 유지 중 — 취소로 생긴 빈자리에도 추가 접수를 받지 않습니다.</div>' +
      '<button id="reopenBtn" class="btn ghost mini">마감 해제 (빈자리 추가접수 받기)</button>';
    $('reopenBtn').addEventListener('click', reopen);
  } else {
    w.innerHTML = '';
  }
}

async function reopen() {
  if (!confirm('마감을 해제할까요? 빈자리부터 추가 접수를 받습니다.')) return;
  if (busy) return;
  busy = true;
  try {
    const d = await api({ action: 'admin_reopen', pass: pw });
    if (d && d.ok) {
      data.effective.manualClosed = false;
      data.count = d.count;
      renderSummary();
      paintReopen();
      busy = false;
      if (tab === 'list') await loadList();
      return;
    } else {
      alert((d && d.detail) || '해제에 실패했습니다.');
    }
  } catch (e) {
    alert('서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
  } finally {
    busy = false;
  }
}

/* ---------------- 설정 탭 (기존 설정 변경 화면) ---------------- */

function renderSettingsTab() {
  const v = data.values;
  const e = data.effective;
  $('tabBody').innerHTML =
    '<p class="sec-title">설정 변경</p>' +
    '<div class="field"><label>제목</label>' +
      '<input id="s_title" type="text" maxlength="60" value="' + esc(v.title) + '" ' +
        'placeholder="' + esc(v.title ? '' : e.title) + '">' +
    '</div>' +
    '<div class="field"><label>신청시작 (날짜와 시각)</label>' +
      '<input id="s_open" type="datetime-local" value="' + esc(openToLocal(v.open)) + '">' +
      '<div class="hint">이 시각 전까지는 신청 화면에 카운트다운이 표시됩니다. 비워 두면 저장 즉시 신청이 열립니다.</div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="field"><label>모집인원</label>' +
        '<input id="s_cap" type="number" min="1" inputmode="numeric" value="' + esc(v.confirmed) + '" ' +
          'placeholder="' + e.confirmed + '">' +
      '</div>' +
      '<div class="field"><label>대기자수</label>' +
        '<input id="s_wait" type="number" min="0" inputmode="numeric" value="' + esc(v.waitlist) + '" ' +
          'placeholder="' + e.waitlist + '">' +
      '</div>' +
    '</div>' +
    '<div class="field"><label>신청 마감자수</label>' +
      '<input id="s_total" type="number" min="1" inputmode="numeric" value="' + esc(v.total) + '" ' +
        'placeholder="' + e.total + '">' +
      '<div class="hint">모집인원·대기자수를 바꾸면 자동으로 (모집+대기)로 채워집니다. 직접 수정도 가능합니다.</div>' +
    '</div>' +
    '<div id="saveMsg"></div>' +
    '<button id="saveBtn" class="btn" style="margin-top:4px">설정 저장</button>';
  $('saveBtn').addEventListener('click', save);
  $('s_cap').addEventListener('input', syncTotal);
  $('s_wait').addEventListener('input', syncTotal);
  $('s_total').addEventListener('input', function () { autoTotal = false; });
}

/* ---------------- 접수명단 탭 ---------------- */

function maskPhone(p) {
  const d = String(p || '').replace(/\D/g, '');
  if (d.length < 7) return esc(p || '');
  return esc(d.slice(0, 3) + '-' + d.slice(3, 7).replace(/./g, '*') + '-' + d.slice(-4));
}

function filteredRows() {
  const q = listFilter.trim();
  if (!q) return rows;
  return rows.filter(function (r) {
    return String(r.student).indexOf(q) !== -1 ||
      String(r.sid).indexOf(q) !== -1 ||
      String(r.guardian).indexOf(q) !== -1;
  });
}

function renderListTab() {
  $('tabBody').innerHTML =
    '<p class="sec-title">접수명단 (' + rows.length + '명)</p>' +
    '<div id="listMsg"></div>' +
    '<div id="listWrap"><p class="center muted">불러오는 중…</p></div>' +
    '<div class="field"><label>검색 (학생명·학번·보호자명)</label>' +
      '<input id="q" type="text" maxlength="20" value="' + esc(listFilter) + '" placeholder="예: 김일광 / 1101">' +
    '</div>' +
    '<div class="row2">' +
      '<button id="reloadBtn" class="btn ghost mini" style="flex:1">새로고침</button>' +
      '<button id="csvBtn" class="btn ghost mini" style="flex:1">CSV 저장</button>' +
    '</div>' +
    '<div class="box info">개별 취소 시 해당 행이 삭제되고 순번이 1번부터 당겨집니다. 대기 1번이 확정 꼬리로 자동 승격됩니다.<br>' +
    '전체 초기화는 아래 빨간 버튼(2중 확인)을 사용하세요. 시트에서 직접 지워도 됩니다.</div>' +
    '<button id="resetBtn" class="btn danger mini">전체 초기화 (접수 0으로)</button>';
  $('q').addEventListener('input', function () { listFilter = $('q').value; paintRows(); });
  $('reloadBtn').addEventListener('click', loadList);
  $('csvBtn').addEventListener('click', downloadCsv);
  $('resetBtn').addEventListener('click', resetAll);
  if (rows.length || listLoaded) paintRows();
  else loadList();
}

let listLoaded = false;

function listMsg(kind, html) {
  const el = $('listMsg');
  if (el) el.innerHTML = html ? '<div class="box ' + kind + '">' + html + '</div>' : '';
}

async function loadList() {
  if (busy) return;
  busy = true;
  listMsg('', '');
  const w = $('listWrap');
  if (w && !rows.length) w.innerHTML = '<p class="center muted">불러오는 중…</p>';
  try {
    // 명단 조회도 20초 타임아웃 + 1회 자동 재시도 (콜드 스타트 대응)
    let d = null;
    for (let i = 0; i < 2; i++) {
      try {
        d = await api({ action: 'admin_list', pass: pw }, 20000);
        break;
      } catch (e) {
        d = null;
        if (i === 0) listMsg('warn', '응답이 느려 다시 불러오는 중…');
      }
    }
    if (!d) {
      listMsg('err', '서버 응답이 없습니다. [새로고침]을 눌러 다시 시도해 주세요.');
      return;
    }
    if (d && d.ok) {
      rows = d.rows || [];
      listLoaded = true;
      data.count = rows.length;
      renderSummary();
      if (tab === 'list') {
        const h = document.querySelector('#tabBody .sec-title');
        if (h) h.textContent = '접수명단 (' + rows.length + '명)';
        paintRows();
      }
    } else if (d && !d.ok) {
      listMsg('err', esc((d && d.detail) || '명단을 불러오지 못했습니다.'));
    } else {
      listMsg('err', '서버에 연결할 수 없습니다.');
    }
  } catch (e) {
    listMsg('err', '서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
  } finally {
    busy = false;
  }
}

function paintRows() {
  const w = $('listWrap');
  if (!w) return;
  const list = filteredRows();
  if (!list.length) {
    w.innerHTML = '<p class="center muted">' +
      (rows.length ? '검색 결과가 없습니다.' : '접수 내역이 없습니다.') + '</p>';
    return;
  }
  let html = '<table class="list"><tr><th>순번</th><th>학생</th><th>연락처</th><th></th></tr>';
  list.forEach(function (r) {
    const pill = r.status === '확정'
      ? '<span class="pill ok">확정</span>'
      : '<span class="pill wait">대기' + (r.waitNo || '') + '</span>';
    html += '<tr>' +
      '<td><b>' + r.order + '</b><br>' + pill + '</td>' +
      '<td>' + esc(r.student) + '<br><span class="muted">' + esc(r.sid) + ' · ' + esc(r.guardian) + '</span></td>' +
      '<td>' + maskPhone(r.phone) + '</td>' +
      '<td><button class="btn small danger" data-cancel="' + r.order + '">취소</button></td>' +
    '</tr>';
  });
  w.innerHTML = html + '</table>';
  const btns = w.querySelectorAll('[data-cancel]');
  for (let i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () { cancelOne(Number(this.getAttribute('data-cancel'))); });
  }
}

async function cancelOne(order) {
  const target = rows.filter(function (r) { return r.order === order; })[0];
  const who = target ? target.student + ' 학생(' + order + '번)' : order + '번';
  if (!confirm(who + ' 접수를 취소할까요?\n취소 후 순번이 당겨지고 대기자가 자동 승격됩니다.')) return;
  if (busy) return;
  busy = true;
  listMsg('', '');
  try {
    const d = await api({ action: 'admin_cancel', pass: pw, order: String(order) });
    if (d && d.ok) {
      let msg = esc(d.message || '취소되었습니다.');
      if (d.promoted && d.promoted.length) {
        msg += '<br>승격: ' + d.promoted.map(function (p) {
          return esc(p.student) + '(' + p.order + '번)';
        }).join(', ');
      }
      if (d.manualClosed) {
        data.effective.manualClosed = true;
        renderSummary();
        paintReopen();
      }
      listMsg('ok', msg);
      busy = false;
      await loadList();
      return;
    } else {
      listMsg('err', esc((d && d.detail) || '취소에 실패했습니다.'));
    }
  } catch (e) {
    listMsg('err', '서버에 연결할 수 없습니다.');
  } finally {
    busy = false;
  }
}

async function resetAll() {
  if (!confirm('접수 내역 전체를 삭제할까요? 이 작업은 되돌릴 수 없습니다.')) return;
  const word = prompt('삭제를 확정하려면 아래에 [초기화]라고 입력하세요.', '');
  if (word === null) return;
  if (String(word).trim() !== '초기화') {
    listMsg('err', '입력 문구가 일치하지 않아 취소했습니다.');
    return;
  }
  if (busy) return;
  busy = true;
  try {
    const d = await api({ action: 'admin_reset', pass: pw, confirm: 'RESET' });
    if (d && d.ok) {
      listMsg('ok', esc(d.message || '초기화되었습니다.'));
      busy = false;
      await loadList();
      return;
    } else {
      listMsg('err', esc((d && d.detail) || '초기화에 실패했습니다.'));
    }
  } catch (e) {
    listMsg('err', '서버에 연결할 수 없습니다.');
  } finally {
    busy = false;
  }
}

/* 엑셀 호환 CSV (BOM + 따옴표 이스케이프) */
function downloadCsv() {
  if (!rows.length) { listMsg('err', '저장할 명단이 없습니다.'); return; }
  const head = ['접수순번', '제출시간', '학번', '학생명', '보호자명', '보호자연락처', '구분', '대기번호', '문자발송'];
  const q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
  const lines = [head.map(q).join(',')];
  rows.forEach(function (r) {
    lines.push([r.order, r.submittedAt, r.sid, r.student, r.guardian, r.phone,
      r.status, r.waitNo == null ? '' : r.waitNo, r.sms].map(q).join(','));
  });
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '신청명단_' + rows.length + '명.csv';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------------- 문자발송 탭 ---------------- */

function smsBytesClient(text) {
  let bytes = 0;
  for (let i = 0; i < text.length; i++) bytes += text.charCodeAt(i) < 128 ? 1 : 2;
  return bytes;
}

/* 기본 문구 — {학생명}·{보호자명}은 발송 시 수신자별로 자동 치환 */
const DEFAULT_SMS_TEXT = '[책과 문화의 밤]\n9/30(수), 오후7시, 별빛도서관\n참가자: {학생명}({보호자명})';

/* 대기자 안내 기본 문구 (수정 가능) */
const DEFAULT_WAITLIST_SMS_TEXT = '[책과 문화의 밤]\n아쉽게도 최종 선정되지 못했습니다.\n다음 기회에 꼭 함께해요!';

function renderSmsText(t, r) {
  // 서버 renderTemplate_와 동일 규칙 (전각 괄호·괄호 안 공백 허용) — 미리보기 일치용
  return String(t)
    .split('｛').join('{').split('｝').join('}')
    .replace(/\{\s*학생명\s*\}/g, r.student)
    .replace(/\{\s*보호자명\s*\}/g, r.guardian);
}

function renderSmsTab() {
  const confirmed = rows.filter(function (r) { return r.status === '확정'; });
  const waitlist = rows.filter(function (r) { return r.status !== '확정'; });
  $('tabBody').innerHTML =
    '<p class="sec-title">최종 안내문자 (확정자 ' + confirmed.length + '명)</p>' +
    '<div class="box info" style="margin-top:0">취소 정리 후 <b>현재 확정자 전체</b>에게 발송합니다. ' +
    '<b>{학생명}</b>·<b>{보호자명}</b>은 각 수신자의 명단 정보로 자동 치환됩니다.<br>' +
    '접수 때 받은 문자(K열)는 그대로 두고, 발송 기록은 『문자기록』 시트에 남습니다.' +
    (listLoaded ? '' : '<br>대상 수를 보려면 [접수명단] 탭을 한 번 열어 명단을 불러오세요.') + '</div>' +
    '<div class="field"><label>문자 내용 (1000자 이내)</label>' +
      '<textarea class="msg" id="b_text" maxlength="1000">' + esc(DEFAULT_SMS_TEXT) + '</textarea>' +
      '<div class="hint" id="b_bytes"></div>' +
    '</div>' +
    '<div class="row2">' +
      '<button id="b_reset" class="btn ghost mini" style="flex:1">기본문구로 되돌리기</button>' +
    '</div>' +
    '<div id="b_preview"></div>' +
    '<div id="b_msg"></div>' +
    '<button id="b_send" class="btn">확정자 전체에게 발송</button>' +
    '<p class="sec-title" style="margin-top:20px">대기자 안내 메시지 (대기자 ' + waitlist.length + '명)</p>' +
    '<div class="box info" style="margin-top:0">현재 <b>대기자 전체</b>에게 발송합니다. ' +
    '<b>{학생명}</b>·<b>{보호자명}</b>은 각 수신자의 명단 정보로 자동 치환됩니다.</div>' +
    '<div class="field"><label>문자 내용 (1000자 이내)</label>' +
      '<textarea class="msg" id="w_text" maxlength="1000">' + esc(DEFAULT_WAITLIST_SMS_TEXT) + '</textarea>' +
      '<div class="hint" id="w_bytes"></div>' +
    '</div>' +
    '<div class="row2">' +
      '<button id="w_reset" class="btn ghost mini" style="flex:1">기본문구로 되돌리기</button>' +
    '</div>' +
    '<div id="w_preview"></div>' +
    '<div id="w_msg"></div>' +
    '<button id="w_send" class="btn">대기자 전체에게 발송</button>';
  const update = function () {
    const t = $('b_text').value;
    const pv = $('b_preview');
    if (confirmed.length) {
      const first = renderSmsText(t, confirmed[0]);
      const b = smsBytesClient(first);
      $('b_bytes').textContent = '첫 대상 기준 ' + first.length + '자 · ' + b + '바이트 · ' +
        (b <= 90 ? 'SMS(단문)' : 'LMS(장문)') + ' (수신자별 글자수 상이)';
      let html = '<div class="hint" style="margin-top:8px">미리보기 (앞 2명)</div>';
      confirmed.slice(0, 2).forEach(function (r) {
        html += '<div class="box info">' + esc(renderSmsText(t, r)).replace(/\n/g, '<br>') + '</div>';
      });
      pv.innerHTML = html;
    } else {
      const b = smsBytesClient(t);
      $('b_bytes').textContent = t.length + '자 · ' + b + '바이트 · ' + (b <= 90 ? 'SMS(단문)' : 'LMS(장문)');
      pv.innerHTML = '';
    }
  };
  $('b_text').addEventListener('input', update);
  $('b_reset').addEventListener('click', function () { $('b_text').value = DEFAULT_SMS_TEXT; update(); });
  update();
  $('b_send').addEventListener('click', broadcast);
  const updateWait = function () {
    const t = $('w_text').value;
    const pv = $('w_preview');
    if (waitlist.length) {
      const first = renderSmsText(t, waitlist[0]);
      const b = smsBytesClient(first);
      $('w_bytes').textContent = '첫 대상 기준 ' + first.length + '자 · ' + b + '바이트 · ' +
        (b <= 90 ? 'SMS(단문)' : 'LMS(장문)') + ' (수신자별 글자수 상이)';
      let html = '<div class="hint" style="margin-top:8px">미리보기 (앞 2명)</div>';
      waitlist.slice(0, 2).forEach(function (r) {
        html += '<div class="box info">' + esc(renderSmsText(t, r)).replace(/\n/g, '<br>') + '</div>';
      });
      pv.innerHTML = html;
    } else {
      const b = smsBytesClient(t);
      $('w_bytes').textContent = t.length + '자 · ' + b + '바이트 · ' + (b <= 90 ? 'SMS(단문)' : 'LMS(장문)');
      pv.innerHTML = '';
    }
  };
  $('w_text').addEventListener('input', updateWait);
  $('w_reset').addEventListener('click', function () { $('w_text').value = DEFAULT_WAITLIST_SMS_TEXT; updateWait(); });
  updateWait();
  $('w_send').addEventListener('click', broadcastWait);
}

function wMsg(kind, html) {
  $('w_msg').innerHTML = html ? '<div class="box ' + kind + '">' + html + '</div>' : '';
}

async function broadcastWait() {
  const t = $('w_text') ? $('w_text').value : '';
  if (!t.trim()) { wMsg('err', '발송할 문자 내용을 입력하세요.'); return; }
  const wait = rows.filter(function (r) { return r.status !== '확정'; }).length;
  const label = listLoaded ? '대기자 ' + wait + '명에게' : '대기자 전체에게';
  if (!confirm(label + ' 아래 내용을 발송할까요?\n\n' + t.slice(0, 120) + (t.length > 120 ? '…' : ''))) return;
  if (busy) return;
  busy = true;
  const btn = $('w_send');
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = '발송 중… (잠시만 기다려 주세요)';
  wMsg('', '');
  try {
    if (t.length > 1000) { wMsg('err', '문자 내용은 1000자 이내로 입력하세요.'); return; }
    const d = await api({ action: 'admin_broadcast', pass: pw, text: t, to: 'waitlist' });
    if (d && d.ok) {
      const fails = (d.results || []).filter(function (r) { return !r.sent; });
      let html = esc(d.message || '발송 완료');
      if (fails.length) {
        html += '<br>실패: ' + fails.map(function (r) {
          return esc(r.student) + '(' + r.order + '번:' + esc(r.result) + ')';
        }).join(', ');
      }
      wMsg(fails.length ? 'warn' : 'ok', html);
    } else {
      wMsg('err', esc((d && d.detail) || '발송에 실패했습니다.'));
    }
  } catch (e) {
    wMsg('err', '서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
  } finally {
    busy = false;
    btn.disabled = false;
    btn.textContent = old;
  }
}

function bMsg(kind, html) {
  $('b_msg').innerHTML = html ? '<div class="box ' + kind + '">' + html + '</div>' : '';
}

async function broadcast() {
  const t = $('b_text') ? $('b_text').value : '';
  if (!t.trim()) { bMsg('err', '발송할 문자 내용을 입력하세요.'); return; }
  const confirmed = rows.filter(function (r) { return r.status === '확정'; }).length;
  const label = listLoaded ? '확정자 ' + confirmed + '명에게' : '확정자 전체에게';
  if (!confirm(label + ' 아래 내용을 발송할까요?\n\n' + t.slice(0, 120) + (t.length > 120 ? '…' : ''))) return;
  if (busy) return;
  busy = true;
  const btn = $('b_send');
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = '발송 중… (잠시만 기다려 주세요)';
  bMsg('', '');
  try {
    // GET 길이 제한 대비 POST 격식: api()는 GET이므로 길이 초과 시 안내
    if (t.length > 1000) { bMsg('err', '문자 내용은 1000자 이내로 입력하세요.'); return; }
    const d = await api({ action: 'admin_broadcast', pass: pw, text: t });
    if (d && d.ok) {
      const fails = (d.results || []).filter(function (r) { return !r.sent; });
      let html = esc(d.message || '발송 완료');
      if (fails.length) {
        html += '<br>실패: ' + fails.map(function (r) {
          return esc(r.student) + '(' + r.order + '번:' + esc(r.result) + ')';
        }).join(', ');
      }
      bMsg(fails.length ? 'warn' : 'ok', html);
    } else {
      bMsg('err', esc((d && d.detail) || '발송에 실패했습니다.'));
    }
  } catch (e) {
    bMsg('err', '서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
  } finally {
    busy = false;
    btn.disabled = false;
    btn.textContent = old;
  }
}

function syncTotal() {
  if (!autoTotal) return;
  const cap = Number(String($('s_cap').value).replace(/[^0-9]/g, '') || 0);
  const wait = Number(String($('s_wait').value).replace(/[^0-9]/g, '') || 0);
  if (cap > 0) $('s_total').value = cap + wait;
}

function saveMsg(kind, html) {
  $('saveMsg').innerHTML = '<div class="box ' + kind + '">' + html + '</div>';
}

async function save() {
  if (busy) return;
  const title = $('s_title').value.trim();
  const open = $('s_open').value || '';
  const digits = function (s) { return String(s).replace(/[^0-9]/g, ''); };
  const cap = digits($('s_cap').value);
  const wait = digits($('s_wait').value);
  const total = digits($('s_total').value);

  if (!title) return saveMsg('err', '제목을 입력해 주세요.');
  if (!cap || Number(cap) < 1) return saveMsg('err', '모집인원을 1명 이상으로 입력해 주세요.');
  if (total !== '' && Number(total) < Number(cap)) {
    return saveMsg('err', '신청 마감자수는 모집인원보다 크거나 같아야 합니다.');
  }
  if (!open && !confirm('신청시작을 비워 두면 저장 즉시 신청이 열립니다. 계속할까요?')) return;

  busy = true;
  const btn = $('saveBtn');
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = '저장 중…';
  try {
    const d = await api({
      action: 'admin_save', pass: pw,
      title: title, open: open,
      confirmed: cap, waitlist: wait, total: total
    });
    if (d && d.ok) {
      data.effective = d.effective;
      data.values = {
        title: title,
        open: open.replace('T', ' '),
        confirmed: cap, waitlist: wait, total: total
      };
      renderSummary();
      paintReopen();
      saveMsg('ok', esc(d.message || '저장되었습니다.'));
    } else {
      saveMsg('err', esc((d && d.detail) || '저장에 실패했습니다.'));
    }
  } catch (e) {
    saveMsg('err', '서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
  } finally {
    busy = false;
    btn.disabled = false;
    btn.textContent = old;
  }
}

/* ---------------- 시작 ---------------- */

function showFatal(msg) {
  setPanel('<div class="card"><div class="box err" style="margin-top:0">' + msg + '</div></div>');
}

async function boot() {
  if (!GAS_URL || GAS_URL.indexOf('http') !== 0) {
    showFatal('앱이 아직 백엔드에 연결되지 않았습니다.<br>admin.html의 GAS_URL 설정을 확인하세요. (설정가이드 5단계)');
    return;
  }
  let saved = '';
  try { saved = sessionStorage.getItem('ilgwang_pw') || ''; } catch (e) {}
  if (saved) {
    try {
      const d = await api({ action: 'admin_get', pass: saved });
      if (d && d.ok) { pw = saved; data = d; showMain(); return; }
    } catch (e) { /* 아래에서 게이트 표시 */ }
    try { sessionStorage.removeItem('ilgwang_pw'); } catch (e2) {}
  }
  showGate('');
}

boot();
